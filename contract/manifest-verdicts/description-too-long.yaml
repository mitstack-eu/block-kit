apiVersion: mitstack/v1beta
type: block
metadata:
  id: billing-bucket
  name: Billing bucket
  owner: acme
spec:
  version: 1.2.0
  description: >
    Keeps one S3 bucket for the billing exports of each app, with versioning
    turned on so an overwritten export can be read back, a lifecycle rule that
    moves exports older than ninety days to cheaper storage, and a policy that
    lets only the app's own role read or write it.
  resources: [aws.s3-bucket]
  lifecycle:
    endpoint: https://billing-bucket.example.com/hook
    operations: [subscribe, unsubscribe]
    contract: kit/v1
