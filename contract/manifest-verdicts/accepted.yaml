apiVersion: mitstack/v1beta
type: block
metadata:
  id: "@acme/billing-bucket"
  name: Billing bucket
  owner: acme
spec:
  version: 1.2.0
  releaseClass: feature
  releaseNote: Keeps the billing exports in a bucket of their own.
  description: Keeps one S3 bucket for the billing exports of each app.
  requires: [aws.vpc]
  resources: [aws.s3-bucket]
  lifecycle:
    endpoint: https://billing-bucket.example.com/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
