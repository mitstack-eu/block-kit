apiVersion: mitstack/v1beta
type: block
metadata:
  id: plain
  name: Plain Tracker
  owner: web-app-platform
spec:
  version: 3.0.0
  releaseClass: breaking
  releaseNote: Plain runs its container on the app's EC2 host, against the Postgres database offered there.
  description: >
    Runs the Plain tracker container on the app's host, connected to the
    app's Postgres database.
  params:
    - name: image
      label: Plain tracker container image
      required: true
  requires: [aws.ec2-instance, aws.ec2-postgres-database]
  resources: [aws.ec2-container]
  provides: [aws.ec2-container]
  lifecycle:
    endpoint: https://api.mitstack.dev/operators/plain/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
