apiVersion: mitstack/v1beta          # placeholder: the new shape gets its own version
type: block
metadata:
  id: plain
  name: Plain Tracker
  owner: web-app-platform
spec:
  version: 3.0.0
  releaseClass: breaking
  releaseNote: Plain runs on any host and takes its database from whichever block offers one.
  description: >
    Runs the Plain tracker container on the app's host, connected to the
    app's Postgres database.
  params:
    - name: image
      label: Plain tracker container image
      required: true
  requires:
    - kind: host
    - kind: postgres-database
  resources:
    - name: tracker
      type: host.container
      on: requires.host
      inputs:
        image: params.image
        port: 8080
        env:
          TRACKER_DB_HOST: requires.postgres-database.outputs.host
          TRACKER_DB_PORT: requires.postgres-database.outputs.port
          TRACKER_DB_NAME: requires.postgres-database.outputs.dbName
          TRACKER_DB_USER: requires.postgres-database.outputs.username
          TRACKER_DB_PASSWORD: requires.postgres-database.outputs.password
  provides: [tracker]
  lifecycle:
    endpoint: https://api.mitstack.dev/operators/plain/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
