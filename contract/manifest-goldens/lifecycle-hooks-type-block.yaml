apiVersion: mitstack/v1alpha
type: block
metadata:
  id: hooks-golden
  name: Hooks Golden
  owner: mitstack
spec:
  version: 1.0.0
  description: A kit/v1 block that registers two lifecycle hooks.
  provides:
    - hooks-golden
  providedContracts:
    - capability: hooks-golden
      format: config
  continuity:
    - name: hooks-state
      store: volume
      stateful: false
  lifecycle:
    endpoint: https://hooks-golden.example.com/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
    hooks:
      - beforeEnsure
      - afterDelete
