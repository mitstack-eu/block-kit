apiVersion: mitstack/v1alpha
kind: Block
metadata:
  id: hooks-golden
  name: Hooks Golden
  owner: mitstack
spec:
  layer: backend-runtime
  version: 1.0.0
  description: A kit/v1 block that registers two lifecycle hooks.
  lifecycle:
    endpoint: https://hooks-golden.example.com/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
    hooks:
      - beforeEnsure
      - afterDelete
