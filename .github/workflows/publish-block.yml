# Reusable block-publish workflow. A block's own ci.yml calls this with
# `uses:` on every event it wants verified, rather than inlining its own
# conformance, scan and publish jobs, so the provenance record every block
# writes beside its image comes from one implementation.
#
# `publish` needs every check job, so a red check never starts a publish, and
# `blockprov build` refuses a non-pass verdict a second time regardless.
#
# No job that runs the block's code holds the `id-token` permission, so
# nothing a block ships can ask GitHub for the identity token that signs its
# record. On a push that publishes, the conformance job hands `publish` the
# image it built, manifest.yaml and its verdict as the `block-release`
# artifact. `publish` checks out none of the block's tree, never builds or
# runs its image, and runs only the kit's own tools on those files.
#
# An OpenTofu-only block, a module with no go.mod whose image builds on the
# opentofu-operator image, sets `opentofu-only`. Its checks then run in the
# `opentofu-conformance` job in place of `conformance`, under the same check
# name. The `base-image` job first assumes the caller's
# AWS_BLOCK_VERIFY_ROLE_ARN role, pulls the operator image the block's
# Dockerfile names and hands it on as a file. `opentofu-conformance` runs the
# kit's blockverify with --opentofu-only on the tree, which on a pull request
# judges spec.version as the Go job does, builds the block's image once on
# the image it was handed, and runs `tofu fmt`, `tofu test` and the operator's
# block-verify inside it. The publish job signs that block-verify result into
# the provenance record, with the kit version the operator binary was built
# with.
#
# The block type's conformance job, `secrets` and `scripts` run on every
# event. `publish` runs only on a push to the caller's default branch, so a
# pull-request run of a caller gets the three checks with the publish job
# skipped. A caller whose calling job is named `block` reports them as
# `block / conformance`, `block / secrets` and `block / scripts`, the contexts
# its main requires.
#
# The `delivery` job, reported as `block / delivery`, runs on a pull request
# only when the caller's organisation or repository defines TRACKER_BASE_URL,
# the address of its board. It runs plain-delivery's pr-delivery, which fails
# code committed before its tests and a key the board does not hold as
# claimed, and it reads the board with the TRACKER_API_TOKEN secret the caller
# passes. A builder's block in an organisation with no board gets the three
# checks above and this job reported as skipped.
#
# `publish` also runs only for a caller that names its image registry in
# `ecr-repository`. A caller naming none still gets every check and its
# attestation, and the `no-registry` job runs in place of `publish` to say in
# the run's summary that nothing was published.
#
# The scan jobs run the kit's own scripts at kit-ref, so a scanner pin
# changes in one place for every block.
#
# Every caller grants packages: read, since GitHub refuses to start a called
# job that asks for more than its caller grants.
#
# Two more jobs call the platform with the MITSTACK_API_TOKEN secret, each
# only when the caller sets its input. `platform-verdict` asks for a dry-run
# apply of manifest.yaml on a pull request, and `attest` posts blockverify's
# report on a push to the default branch.
#
# A run that builds a version's image, or completes its record from the commit
# that built it, cuts the release tag v<version> at that commit once both are
# pushed, and then starts the block's publisher workflow at the tag where the
# block holds one. Before it pushes anything, the run fails when the tag
# already names another commit, so a tag never moves. A later push that keeps
# spec.version, as a change to Markdown alone may, finds the image and its
# record published, pushes nothing and cuts no tag.
#
# A version tag already in the registry is never pushed over. The probe asks
# two questions, whether the tag is published and whether its provenance
# record sits beside it. A rerun that finds the tag published but no
# provenance record builds and pushes the record for the existing digest and
# never pushes the image again. The record signs the run's commit, so only a
# rerun of the run that built the image completes it; a later commit that
# finds the record missing fails rather than attesting an image it did not
# build. The record also signs the verdict of the image the run was handed, so
# that rerun is a rerun of the failed jobs, which reads the first hand-over
# while GitHub keeps it. A rerun of every job hands over a new build, and
# `publish` refuses to complete the record with it. A tag that already has
# its record ends green with no writes.
#
# A caller that names a platform in `record-api-url` has the publish job post
# the release's record to that platform's record route once the release is
# cut. The record's signature is its only credential, so the post sends the
# record alone, with no token, and the platform's answer goes to the run's
# summary. A stored record and one the platform already holds end the job
# green. A refusal fails it with the platform's own text, which names the
# refused check, and so does a platform that gives no answer. The job posts
# the record it reads back from beside the image, so a rerun, which builds no
# record, posts the same one. A caller that names no platform gets no such
# step.
#
# Two events scan the block's image with the kit's scripts/scan-image.sh, which
# refuses every finding that has a fixed version. On a pull request, whichever
# conformance job runs builds the image, pushes it nowhere and scans it, so a
# finding fails the conformance check before merge. On a push to the default
# branch, the publish job scans the image it was handed before any push. No
# other event scans the image. The one finding the script accepts is
# GO-2026-5932 in an OpenTofu provider binary that
# scripts/go-2026-5932-exception.sh proves free of openpgp code.
name: publish-block

on:
  workflow_call:
    inputs:
      block-id:
        required: true
        type: string
      ecr-repository:
        required: false
        type: string
      aws-region:
        required: false
        type: string
        default: eu-central-1
      kit-ref:
        required: false
        type: string
        default: main
      go-version:
        required: false
        type: string
        default: "1.26.11"
      runs-on:
        required: false
        type: string
        default: '["ubicloud-standard-2"]'
      opentofu-only:
        required: false
        type: boolean
        default: false
      platform-verdict:
        required: false
        type: boolean
        default: false
      post-attestation:
        required: false
        type: boolean
        default: false
      # The platform both conformance jobs read the served type snapshot from,
      # and platform-verdict and attest call.
      api-url:
        required: false
        type: string
        default: https://api.mitstack.dev
      # The workflow file in the block's own repository that copies each
      # release tag to its public release repository, started at each tag.
      publisher-workflow:
        required: false
        type: string
        default: release-publisher.yml
      # The platform the publish job posts each release's signed record to,
      # such as https://api.mitstack.dev. Empty posts nothing.
      record-api-url:
        required: false
        type: string
        default: ''
    # The token the platform's scaffold seals into the block's repository,
    # which opens that block's manifest, attestations and dry-run apply alone.
    secrets:
      MITSTACK_API_TOKEN:
        required: false
      # The board token the delivery job reads issue statuses with.
      TRACKER_API_TOKEN:
        required: false

# A workflow-level default is a ceiling rather than a floor: each job below
# re-grants what it actually needs.
permissions:
  contents: read

# A job's own if: cannot read env, so publish and no-registry spell out the
# event and branch test themselves.
env:
  PUBLISHES: ${{ inputs.ecr-repository != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # A branch protection rule names one conformance check for every block type,
  # so whichever of the two conformance jobs runs takes the name.
  conformance:
    name: ${{ inputs.opentofu-only && 'go conformance' || 'conformance' }}
    if: ${{ !inputs.opentofu-only }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    steps:
      # The block's own tests run in this tree, so the checkout keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy reads these from its working directory with no flag, so a
      # committed one could silence a finding. None is allowed anywhere.
      - name: Refuse a committed Trivy ignore or config file
        run: |
          set -euo pipefail
          found=$(find . -path ./.git -prune -o \( -name .trivyignore -o -name .trivyignore.yaml -o -name trivy.yaml -o -name trivy-secret.yaml \) -print)
          if [ -n "$found" ]; then
            printf 'Trivy would read these with no flag, so the image is neither scanned nor pushed:\n%s\n' "$found" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: go vet
        run: go vet ./...

      # The block's own tests may build its image, which may build on a
      # private package its own repository publishes.
      - name: Log in to ghcr.io with the job's token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # This is where the block's own kittest goldens and verb-semantics
      # suite run — the block's go.mod, not the kit's.
      - name: go test
        run: go test ./...

      # blockverify is built from a checkout of kit-ref rather than a `go run`
      # of a released tag, so the reusable workflow works whether or not a
      # given kit-ref has been tagged yet.
      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Build blockverify
        working-directory: block-kit
        run: go build -o ../blockverify ./verify/blockverify

      - name: Build commentcheck
        working-directory: block-kit
        run: go build -o ../commentcheck ./cmd/commentcheck

      # The image builds from the block's tree, so the binary stays outside it.
      - name: Build checkpolls
        working-directory: block-kit
        run: go build -o "$RUNNER_TEMP/checkpolls" ./cmd/checkpolls

      # blockverify judges `.` and the image builds from `.`, so the kit
      # checked out inside the block's tree must be gone before either reads
      # it, or the block is judged by the kit's own source. The image scan
      # runs the kit's scripts from where the checkout moves to.
      - name: Remove the kit checkout from the block tree
        run: mv block-kit "$RUNNER_TEMP/block-kit"

      # On a pull request blockverify judges spec.version against the base
      # commit's manifest.yaml and the files the pull request changes. Both
      # files go to RUNNER_TEMP, outside the tree blockverify judges. The
      # checkout keeps no credential, so the fetch of the base commit takes
      # the job's token through git's environment.
      - name: Write the base commit's manifest and the changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/write-pr-base.sh" "$BASE_SHA" "$RUNNER_TEMP"

      - name: Fail a pull request that adds a fixed sleep or a polling interval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/checkpolls" -base "$BASE_SHA"

      - name: Judge the comments this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./commentcheck -base "$BASE_SHA" .

      # blockverify compares the block's type-snapshot.json with the snapshot
      # the platform serves, which needs no token.
      - name: blockverify (standalone contract check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_URL: ${{ inputs.api-url }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/run-blockverify.sh" ./blockverify blockverify-report.json "$EVENT_NAME" "$RUNNER_TEMP" --api-url "$API_URL"

      # A failing run's report is exactly the one that must not be lost.
      - name: Upload blockverify report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockverify-report
          path: blockverify-report.json

      # A push that publishes hands this image to publish, which scans it.
      - name: Build the block image
        if: github.event_name == 'pull_request' || env.PUBLISHES == 'true'
        run: DOCKER_BUILDKIT=1 docker build -t "block:${GITHUB_SHA}" .

      - name: Scan the block image
        if: github.event_name == 'pull_request'
        run: bash "$RUNNER_TEMP/block-kit/scripts/scan-image.sh" "block:${GITHUB_SHA}"

      - name: Collect what the release signs
        if: env.PUBLISHES == 'true'
        env:
          PUBLISHER_WORKFLOW: ${{ inputs.publisher-workflow }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/collect-release.sh" "block:${GITHUB_SHA}" "$RUNNER_TEMP/block-release" "$PUBLISHER_WORKFLOW" manifest.yaml go.mod blockverify-report.json

      - name: Hand the release to the publish job
        if: env.PUBLISHES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: block-release
          path: ${{ runner.temp }}/block-release
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  # Assuming the verify role takes an identity token, so the pull of the
  # private operator image is a job of its own that runs none of the block's
  # code. It reads the Dockerfile as text through the API, with no checkout.
  base-image:
    name: base image
    if: inputs.opentofu-only
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Configure AWS credentials for the verify role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BLOCK_VERIFY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # The verify role sits in the account whose registry holds the operator image.
      - name: Log in to the operator image's registry
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Pull the images the block's Dockerfile names in that registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash block-kit/scripts/base-images.sh pull "$REGISTRY" "$RUNNER_TEMP/base-images"

      - name: Hand the base images to the conformance job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-images
          path: ${{ runner.temp }}/base-images
          retention-days: 1
          overwrite: true

  # A failed need would skip this job, and a required check that is skipped
  # reads as passed, so it runs whatever base-image's result and fails in a
  # step of its own.
  opentofu-conformance:
    name: ${{ inputs.opentofu-only && 'conformance' || 'opentofu conformance' }}
    needs: base-image
    if: ${{ !cancelled() && inputs.opentofu-only }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy reads these from its working directory with no flag, so a
      # committed one could silence a finding. None is allowed anywhere.
      - name: Refuse a committed Trivy ignore or config file
        run: |
          set -euo pipefail
          found=$(find . -path ./.git -prune -o \( -name .trivyignore -o -name .trivyignore.yaml -o -name trivy.yaml -o -name trivy-secret.yaml \) -print)
          if [ -n "$found" ]; then
            printf 'Trivy would read these with no flag, so the image is neither scanned nor pushed:\n%s\n' "$found" >&2
            exit 1
          fi

      # blockverify and the image scan's GO-2026-5932 exception are Go tools
      # of the kit's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      # The image copies the block's whole tree, so blockverify and its report
      # live in RUNNER_TEMP.
      - name: Build blockverify
        working-directory: block-kit
        run: go build -o "$RUNNER_TEMP/blockverify" ./verify/blockverify

      - name: Build checkpolls
        working-directory: block-kit
        run: go build -o "$RUNNER_TEMP/checkpolls" ./cmd/checkpolls

      # The image builds from `.`, so the kit leaves the block's tree first.
      - name: Remove the kit checkout from the block tree
        run: mv block-kit "$RUNNER_TEMP/block-kit"

      # This checkout keeps no credential, so the fetch of the base commit
      # takes the job's token through git's environment, and nothing writes it
      # into the tree.
      - name: Write the base commit's manifest and the changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/write-pr-base.sh" "$BASE_SHA" "$RUNNER_TEMP"

      # blockverify reads only the tree and the platform's served type
      # snapshot, so it judges the block before the job fetches any image.
      - name: blockverify (standalone contract check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_URL: ${{ inputs.api-url }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/run-blockverify.sh" "$RUNNER_TEMP/blockverify" "$RUNNER_TEMP/blockverify-report.json" "$EVENT_NAME" "$RUNNER_TEMP" --opentofu-only --api-url "$API_URL"

      - name: Upload blockverify report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockverify-report
          path: ${{ runner.temp }}/blockverify-report.json

      - name: Fail a pull request that adds a fixed sleep or a polling interval
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/checkpolls" -base "$BASE_SHA"

      # A rerun could otherwise build on the images an earlier attempt handed
      # over.
      - name: Stop where the base image job did not succeed
        if: needs.base-image.result != 'success'
        env:
          RESULT: ${{ needs.base-image.result }}
        run: |
          echo "::error::the base image job ended ${RESULT}, so this run was handed no base image to build on"
          exit 1

      - name: Fetch the base images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-images
          path: ${{ runner.temp }}/base-images

      # The block's image may build on a private package its own repository
      # publishes.
      - name: Log in to ghcr.io with the job's token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # The contexts go through a file, since a failed load inside a process
      # substitution would not stop the build.
      - name: Build the block image
        id: image
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/block-kit/scripts/base-images.sh" load "$RUNNER_TEMP/base-images" > "$RUNNER_TEMP/base-contexts"
          mapfile -t contexts < "$RUNNER_TEMP/base-contexts"
          DOCKER_BUILDKIT=1 docker buildx build "${contexts[@]}" --iidfile "$RUNNER_TEMP/block.iid" -t "block:${GITHUB_SHA}" .
          echo "id=$(cat "$RUNNER_TEMP/block.iid")" >> "$GITHUB_OUTPUT"

      - name: tofu fmt -check
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: docker run --rm --entrypoint tofu "$IMAGE_ID" fmt -check -diff -recursive -no-color /module

      - name: tofu test
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_ID" -c \
            'tofu -chdir=/module init -backend=false -input=false -no-color > /dev/null && tofu -chdir=/module test -no-color'

      # The record signs this output, of the very image a release pushes.
      - name: block-verify
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint block-verify "$IMAGE_ID" -test.v | tee "$RUNNER_TEMP/block-verify.txt"

      # A push that publishes hands this image to publish, which scans it.
      - name: Scan the block image
        if: github.event_name == 'pull_request'
        run: bash "$RUNNER_TEMP/block-kit/scripts/scan-image.sh" "block:${GITHUB_SHA}"

      - name: Collect what the release signs
        if: env.PUBLISHES == 'true'
        env:
          PUBLISHER_WORKFLOW: ${{ inputs.publisher-workflow }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/collect-release.sh" "block:${GITHUB_SHA}" "$RUNNER_TEMP/block-release" "$PUBLISHER_WORKFLOW" manifest.yaml "$RUNNER_TEMP/block-verify.txt"

      - name: Hand the release to the publish job
        if: env.PUBLISHES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: block-release
          path: ${{ runner.temp }}/block-release
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  secrets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: block
          fetch-depth: 0 # the scan reads every commit HEAD reaches
          persist-credentials: false

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Scan every commit for secrets with gitleaks
        run: bash block-kit/scripts/scan-secrets.sh block

      # A tool a block fetches from a GitHub release page while it runs fails
      # whenever GitHub does, so a block copies it from an image by digest.
      - name: Fail a shipped file that fetches a tool from a GitHub release page
        run: bash block-kit/scripts/check-runtime-downloads.sh block

  scripts:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: block
          persist-credentials: false

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Lint every tracked shell script with shellcheck
        run: bash block-kit/scripts/lint-scripts.sh block

  delivery:
    if: github.event_name == 'pull_request' && vars.TRACKER_BASE_URL != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit range needs history a shallow checkout has not
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      # The title reaches the shell through the environment, since a pull
      # request's title is text its author controls.
      - name: Judge the commit order and the board keys
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRACKER_BASE_URL: ${{ vars.TRACKER_BASE_URL }}
          TRACKER_API_TOKEN: ${{ secrets.TRACKER_API_TOKEN }}
        run: go run github.com/mitstack-eu/plain-delivery/cmd/pr-delivery@v0.2.0 --repo . --base "$BASE_SHA" --head "$HEAD_SHA"

  # The platform runs every check a real apply runs on manifest.yaml, the ones
  # that read its own records included, and writes nothing, so a pull request
  # shows the platform's own verdict before anything is published.
  platform-verdict:
    if: inputs.platform-verdict && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ask the platform for its verdict on manifest.yaml
        env:
          API_URL: ${{ inputs.api-url }}
          MITSTACK_API_TOKEN: ${{ secrets.MITSTACK_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MITSTACK_API_TOKEN" ]; then
            echo "::error::platform-verdict needs the MITSTACK_API_TOKEN secret; pass it with secrets: inherit"
            exit 1
          fi
          status=$(curl -sS -o verdict.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $MITSTACK_API_TOKEN" \
            -H "Content-Type: application/yaml" \
            --data-binary @manifest.yaml \
            "$API_URL/v1/blocks/apply?dryRun=true")
          body=$(tr -d '\r' < verdict.json | tr '\n' ' ')
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::The platform refused manifest.yaml with HTTP $status: $body"
            exit 1
          fi
          echo "The platform accepts manifest.yaml: $body"

  # The attestation route digests the platform's own copy of the manifest, so
  # blockverify judges that copy, and the platform signs a passing report as
  # the attestation the catalogue badge reads. The job repeats the blockverify
  # build that conformance runs.
  attest:
    needs: [conformance, secrets, scripts]
    if: inputs.post-attestation && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Build blockverify
        working-directory: block-kit
        run: go build -o ../blockverify ./verify/blockverify

      - name: Remove the kit checkout from the block tree
        run: |
          rm -rf block-kit

      - name: Fetch the platform's manifest
        env:
          API_URL: ${{ inputs.api-url }}
          MITSTACK_API_TOKEN: ${{ secrets.MITSTACK_API_TOKEN }}
          BLOCK_ID: ${{ inputs.block-id }}
        run: |
          set -euo pipefail
          if [ -z "$MITSTACK_API_TOKEN" ]; then
            echo "::error::post-attestation needs the MITSTACK_API_TOKEN secret; pass it with secrets: inherit"
            exit 1
          fi
          id=$(jq -rn --arg id "$BLOCK_ID" '$id | @uri')
          status=$(curl -sS -o platform-manifest.yaml -w '%{http_code}' \
            -H "Authorization: Bearer $MITSTACK_API_TOKEN" \
            "$API_URL/v1/blocks/$id/manifest")
          if [ "${status:0:1}" != "2" ]; then
            body=$(tr -d '\r' < platform-manifest.yaml | tr '\n' ' ')
            echo "::error::Fetching the platform's manifest failed with HTTP $status: $body"
            exit 1
          fi
          mv platform-manifest.yaml manifest.yaml

      - name: blockverify (standalone, for the attestation)
        run: ./blockverify --standalone --json . > attestation-report.json

      - name: Post the attestation
        env:
          API_URL: ${{ inputs.api-url }}
          MITSTACK_API_TOKEN: ${{ secrets.MITSTACK_API_TOKEN }}
          BLOCK_ID: ${{ inputs.block-id }}
        run: |
          set -euo pipefail
          if [ -z "$MITSTACK_API_TOKEN" ]; then
            echo "::error::post-attestation needs the MITSTACK_API_TOKEN secret; pass it with secrets: inherit"
            exit 1
          fi
          id=$(jq -rn --arg id "$BLOCK_ID" '$id | @uri')
          status=$(curl -sS -o attestation.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $MITSTACK_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @attestation-report.json \
            "$API_URL/v1/blocks/$id/attestations")
          body=$(tr -d '\r' < attestation.json | tr '\n' ' ')
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::Posting the attestation failed with HTTP $status: $body"
            exit 1
          fi
          echo "The platform signed the attestation: $body"

  # The one job that signs: it holds `id-token`, so it checks out no block
  # tree, never builds or runs the image, and reads the block's files as data.
  #
  # One of the two conformance jobs is always skipped, and GitHub skips a job
  # with a skipped need unless its if: calls a status function. So this if:
  # asks that no need failed or was cancelled.
  publish:
    needs: [conformance, opentofu-conformance, secrets, scripts]
    if: ${{ !cancelled() && !failure() && inputs.ecr-repository != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # contents: write cuts the release tag and actions: write starts the
    # publisher, so a caller grants both to the job calling this workflow.
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BLOCK_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      # blockprov lives in RUNNER_TEMP, where no file of the block's can
      # replace it.
      - name: Build blockprov
        working-directory: block-kit
        run: go build -o "$RUNNER_TEMP/blockprov" ./verify/blockprov

      # The block's files land in the working directory below, so the kit
      # leaves it first, or one of them could replace a kit script.
      - name: Move the kit out of the working directory
        run: |
          mv block-kit "$RUNNER_TEMP/block-kit"

      - name: Log in to ECR
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin "$REGISTRY"

      # Every step after this one treats these files as data: none runs an
      # action, builds, or runs a file from the working directory.
      - name: Fetch what the release signs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: block-release

      # A version tag already in the registry is never pushed over, and a
      # record already beside it is never written again. This probe is
      # read-only and answers into $GITHUB_OUTPUT: `tag`, the release tag
      # v<version>; `published` for that tag; `record` for the provenance
      # record tag sha256-<hex>.prov that `blockprov push` writes for that
      # digest; and `built`, whether this commit built the image. A tag
      # that is not published has no digest yet, so its record is absent
      # by definition and is not probed, and this run pushes it. The push
      # tags the image with the commit sha, so for a published tag only the
      # run that built it, or a rerun of that run, answers `built=true`. A
      # missing record is completed only for an image this commit built,
      # since the record signs this commit. `aws ecr batch-get-image`
      # exits 0 with `None` when a tag is absent, so `None` and empty are
      # the only signals read as "absent". A non-zero exit from aws means
      # the probe could not answer, and that fails the job rather than
      # being read as absent.
      - name: Probe the version tag and its provenance record
        id: existing
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          probe() {
            aws ecr batch-get-image --repository-name "${{ inputs.ecr-repository }}" --image-ids "imageTag=$1" --query 'images[0].imageId.imageDigest' --output text
          }
          DIGEST=$(probe "v${VERSION}") || {
            echo "probe for v${VERSION} failed; refusing to guess whether it is published" >&2
            exit 1
          }
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already published: v${VERSION} ${DIGEST}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

          RECORD_TAG="sha256-${DIGEST#sha256:}.prov"
          RECORD=$(probe "$RECORD_TAG") || {
            echo "probe for ${RECORD_TAG} failed; refusing to guess whether the provenance record exists" >&2
            exit 1
          }
          BUILT=$(probe "${GITHUB_SHA}") || {
            echo "probe for ${GITHUB_SHA} failed; refusing to guess whether this commit built v${VERSION}" >&2
            exit 1
          }
          if [ "$BUILT" = "$DIGEST" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RECORD" ] && [ "$RECORD" != "None" ]; then
            echo "provenance record present at ${RECORD_TAG}"
            echo "record=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The record signs this run's commit, so it is completed only for
          # an image this commit built.
          if [ "$BUILT" != "$DIGEST" ]; then
            echo "no provenance record at ${RECORD_TAG}, and v${VERSION} (${DIGEST}) was not built from commit ${GITHUB_SHA} (its sha tag answers ${BUILT}); re-run the failed jobs of the run that published it, while GitHub keeps that run's block-release artifact, to complete the record" >&2
            exit 1
          fi
          echo "no provenance record at ${RECORD_TAG}; completing it for ${DIGEST}"
          echo "record=false" >> "$GITHUB_OUTPUT"

      - name: Refuse a version tagged at another commit
        if: steps.existing.outputs.built == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.existing.outputs.tag }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/release-tag.sh" check "$TAG"

      # The image is the one the conformance job built and judged. Any finding
      # with a fixed version, at any severity, stops the job before the first
      # push, but the one scan-image.sh's exception proves.
      - name: Scan and push the image
        if: steps.existing.outputs.published == 'false'
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          docker load --input image.tar
          docker tag "block:${GITHUB_SHA}" "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}"
          docker tag "block:${GITHUB_SHA}" "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}"
          bash "$RUNNER_TEMP/block-kit/scripts/scan-image.sh" "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}"
          # The sha tag goes first: a version tag in the registry then always
          # has the sha tag the probe checks before completing a record.
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}"
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}" | cut -d@ -f2)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      # The record signs the verdict of the image this run was handed, so it
      # is completed only where that image is the one already published.
      - name: Refuse to complete the record of an image this run was not handed
        if: steps.existing.outputs.published == 'true' && steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          published="${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST}"
          docker load --input image.tar
          docker pull "$published"
          content='{{json .RootFS.Layers}} {{json .Config}}'
          handed=$(docker image inspect --format "$content" "block:${GITHUB_SHA}")
          found=$(docker image inspect --format "$content" "$published")
          if [ "$handed" != "$found" ]; then
            echo "::error::the image this run was handed is not the one published as ${published}, so its verdict cannot be signed for that image. Re-run only the failed jobs of the run that pushed it, while GitHub keeps that run's block-release artifact, or release a new version." >&2
            exit 1
          fi

      # kit-ref names the kit that BUILT the tools above, not the one this
      # block compiles against, so the record's kitVersion comes from the
      # block-kit pin in the go.mod the conformance job handed over.
      - name: Determine the kit version pinned in go.mod
        if: steps.existing.outputs.record == 'false' && !inputs.opentofu-only
        run: |
          set -euo pipefail
          # `|| true` keeps a no-match grep from tripping `set -e` under
          # `pipefail` before the check below ever runs — the failure is
          # still reported, just by that explicit check and its message
          # rather than a bare, undiagnosed pipeline abort.
          KIT_VERSION=$(grep -oE 'github\.com/mitstack-eu/block-kit v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | awk '{print $2}' || true)
          if [ -z "$KIT_VERSION" ]; then
            echo "no block-kit version pin found in go.mod (checked github.com/mitstack-eu/block-kit)" >&2
            exit 1
          fi
          echo "KIT_VERSION=$KIT_VERSION" >> "$GITHUB_ENV"

      # An OpenTofu-only block has no go.mod, so the record's kitVersion is the
      # block-kit version the operator binary in its image was built with,
      # which the binary's Go build information names.
      - name: Determine the kit version the operator image was built with
        if: steps.existing.outputs.record == 'false' && inputs.opentofu-only
        run: |
          set -euo pipefail
          container=$(docker create "${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST}")
          docker cp "$container:/usr/local/bin/opentofu-operator" "$RUNNER_TEMP/opentofu-operator"
          docker rm "$container" > /dev/null
          # A go.mod among the files handed over could otherwise choose the Go
          # that runs here.
          KIT_VERSION=$(GOTOOLCHAIN=local go version -m "$RUNNER_TEMP/opentofu-operator" | awk '$1 == "dep" && $2 == "github.com/mitstack-eu/block-kit" {print $3}')
          if [ -z "$KIT_VERSION" ]; then
            echo "the operator binary in ${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST} names no block-kit module" >&2
            exit 1
          fi
          echo "KIT_VERSION=$KIT_VERSION" >> "$GITHUB_ENV"

      # A second gate over the same fact `needs: conformance` already
      # enforces: blockprov build refuses to sign anything but the pass the
      # conformance job handed over.
      - name: blockprov build
        if: steps.existing.outputs.record == 'false'
        env:
          OPENTOFU_ONLY: ${{ inputs.opentofu-only }}
        run: |
          result=(--report blockverify-report.json)
          if [ "$OPENTOFU_ONLY" = "true" ]; then
            result=(--block-verify block-verify.txt)
          fi
          "$RUNNER_TEMP/blockprov" build \
            --manifest manifest.yaml \
            "${result[@]}" \
            --block-id ${{ inputs.block-id }} \
            --block-version "$(awk '$1=="version:"{print $2; exit}' manifest.yaml)" \
            --image-ref "${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST}" \
            --image-digest "$IMAGE_DIGEST" \
            --kit-version "$KIT_VERSION" \
            --repository "${{ github.repository }}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --token-request-token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --out record.json

      # Masked and handed on as an env var, never as an argument. The comment
      # on "blockprov push", which reads it, says why.
      - name: Fetch ECR password
        id: ecr_password
        if: steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          PASSWORD=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # The credential is read from the environment, never argv, so it never
      # sits in /proc or a stray `set -x` trace.
      - name: blockprov push
        if: steps.existing.outputs.record == 'false'
        env:
          ECR_PASSWORD: ${{ steps.ecr_password.outputs.password }}
        run: |
          "$RUNNER_TEMP/blockprov" push \
            --record record.json \
            --registry "$REGISTRY" \
            --repo "${{ inputs.ecr-repository }}" \
            --image-digest "$IMAGE_DIGEST" \
            --username AWS \
            --password-env ECR_PASSWORD

      - name: Tag the release at the commit it built
        if: steps.existing.outputs.built == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.existing.outputs.tag }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/release-tag.sh" push "$TAG"

      - name: Start the block's publisher at the release tag
        if: steps.existing.outputs.built == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.existing.outputs.tag }}
          PUBLISHER_WORKFLOW: ${{ inputs.publisher-workflow }}
        run: bash "$RUNNER_TEMP/block-kit/scripts/release-tag.sh" dispatch "$TAG" "$PUBLISHER_WORKFLOW"

      # The record beside the image is this run's only where this commit built
      # the image. A later commit that keeps the version finds another run's
      # record, whose signing key GitHub may have retired, and posts nothing.
      - name: Post the record to the platform the caller names
        if: inputs.record-api-url != ''
        env:
          RECORD_API_URL: ${{ inputs.record-api-url }}
          BUILT: ${{ steps.existing.outputs.built }}
        run: |
          set -euo pipefail
          if [ "$BUILT" = "false" ]; then
            echo "This commit did not build the published image, so this run posts no record."
            exit 0
          fi
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
          echo "::add-mask::$ECR_PASSWORD"
          export ECR_PASSWORD
          "$RUNNER_TEMP/blockprov" pull \
            --registry "$REGISTRY" \
            --repo "${{ inputs.ecr-repository }}" \
            --image-digest "$IMAGE_DIGEST" \
            --username AWS \
            --password-env ECR_PASSWORD \
            --out "$RUNNER_TEMP/published-record.json"
          "$RUNNER_TEMP/blockprov" post \
            --record "$RUNNER_TEMP/published-record.json" \
            --platform "$RECORD_API_URL" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Runs where publish would, for a caller naming no registry, so a push that
  # publishes nothing says so in the run's summary.
  no-registry:
    needs: [conformance, opentofu-conformance, secrets, scripts]
    if: ${{ !cancelled() && !failure() && inputs.ecr-repository == '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions: {}
    steps:
      - name: Say that no registry was named and nothing was published
        run: echo "No image registry was named in the ecr-repository input, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
