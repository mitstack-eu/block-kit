# Reusable block-publish workflow. A block's own ci.yml calls this with
# `uses:` on every event it wants verified, rather than inlining its own
# conformance and publish jobs, so the provenance record every block writes
# beside its image comes from one implementation.
#
# Two jobs, and the ordering IS the acceptance criterion: `publish` needs
# `conformance`, so a red conformance run never starts a publish, and
# `blockprov build` refuses a non-pass verdict a second time regardless.
#
# `conformance` runs on every event. `publish` runs only on a push to the
# caller's default branch, so a pull-request run of a caller gets
# conformance with the publish job skipped.
#
# A version tag already in the registry is never pushed over. The probe asks
# two questions, whether the tag is published and whether its provenance
# record sits beside it. A rerun that finds the tag published but no
# provenance record builds and pushes the record for the existing digest and
# never pushes the image again. The record signs the run's commit, so only a
# rerun of the run that built the image completes it; a later commit that
# finds the record missing fails rather than attesting an image it did not
# build. A tag that already has its record ends green
# with no writes.
name: publish-block

on:
  workflow_call:
    inputs:
      block-id:
        required: true
        type: string
      ecr-repository:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: eu-central-1
      kit-ref:
        required: false
        type: string
        default: main
      go-version:
        required: false
        type: string
        default: "1.26.8"
      runs-on:
        required: false
        type: string
        default: '["ubicloud-standard-2"]'

# A workflow-level default is a ceiling rather than a floor: each job below
# re-grants what it actually needs.
permissions:
  contents: read
  id-token: write

jobs:
  conformance:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BLOCK_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # A short-lived GitHub App installation token, downscoped to
      # contents:read on operator-kit, so `go mod download` can fetch the
      # private module this block depends on. Credentials live in prod SSM,
      # reached over this repo's own per-block AWS OIDC role.
      - name: Mint kit token
        id: kit_token
        run: |
          set -euo pipefail
          APP_ID=$(aws ssm get-parameter --with-decryption --name /mitstack/MITSTACK_GITHUB_APP_ID --query Parameter.Value --output text)
          aws ssm get-parameter --with-decryption --name /mitstack/MITSTACK_GITHUB_APP_PRIVATE_KEY --query Parameter.Value --output text | sed 's/\\n/\n/g' > /tmp/app-key.pem
          chmod 600 /tmp/app-key.pem

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          JWT_HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          JWT_PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | b64url)
          JWT_SIG=$(printf '%s.%s' "$JWT_HEADER" "$JWT_PAYLOAD" | openssl dgst -sha256 -sign /tmp/app-key.pem -binary | b64url)
          JWT="$JWT_HEADER.$JWT_PAYLOAD.$JWT_SIG"
          rm -f /tmp/app-key.pem

          INSTALLATION_ID=$(curl -fsSL -H "Authorization: Bearer $JWT" https://api.github.com/app/installations \
            | jq -r '.[] | select(.account.login == "mitstack-eu") | .id')
          RESPONSE=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -d '{"repositories":["operator-kit"],"permissions":{"contents":"read"}}' \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
          TOKEN=$(jq -r .token <<<"$RESPONSE")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          # The minted token's own answer is logged, never the token itself.
          jq -r '"kit token minted: expires_at=\(.expires_at) repositories=\([.repositories[]?.name] | join(","))"' <<<"$RESPONSE"
          echo "KIT_TOKEN_MINTED_AT=$(date +%s)" >> "$GITHUB_ENV"

          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/mitstack-eu" >> "$GITHUB_ENV"

      # A bounded retry of the private kit fetch that logs why each attempt
      # failed; go vet and go test then read the module cache it filled.
      - name: Fetch Go modules
        env:
          KIT_TOKEN: ${{ steps.kit_token.outputs.token }}
        run: |
          set -uo pipefail
          # Runs "$@" up to KIT_FETCH_ATTEMPTS times, sleeping
          # KIT_FETCH_BACKOFF_SECONDS times the attempt number between tries.
          # Each failure logs the fetch output, the seconds since the mint and
          # what the same token's API view lists, never the token itself.
          kit_fetch_retry() {
            local attempts=${KIT_FETCH_ATTEMPTS:-5} backoff=${KIT_FETCH_BACKOFF_SECONDS:-10}
            local n=1 out code since body names
            # A bound that is not a positive integer would never end the loop.
            case "$attempts" in ''|*[!0-9]*|0) echo "KIT_FETCH_ATTEMPTS must be a positive integer, got '${attempts}'" >&2; return 2;; esac
            case "$backoff" in ''|*[!0-9]*) echo "KIT_FETCH_BACKOFF_SECONDS must be a whole number, got '${backoff}'" >&2; return 2;; esac
            while :; do
              since=""
              if out=$("$@" 2>&1); then code=0; else code=$?; fi
              [ -n "${KIT_TOKEN:-}" ] && out=${out//"$KIT_TOKEN"/***}
              [ -n "${KIT_TOKEN_MINTED_AT:-}" ] && since=", $(( $(date +%s) - KIT_TOKEN_MINTED_AT ))s after the kit token was minted"
              if [ "$code" -eq 0 ]; then
                [ -n "$out" ] && printf '%s\n' "$out"
                echo "kit fetch succeeded on attempt ${n}/${attempts}${since}"
                return 0
              fi
              echo "::warning::kit fetch attempt ${n}/${attempts} failed (exit ${code}${since})"
              printf '%s\n' "$out" | tail -n 20
              if [ -n "${KIT_TOKEN:-}" ]; then
                if body=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${KIT_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/installation/repositories?per_page=100" 2>&1) &&
                   names=$(jq -r '[.repositories[].name] | join(",")' <<<"$body" 2>/dev/null); then
                  echo "kit token repository view: ${names}"
                else
                  body=${body//"$KIT_TOKEN"/***}
                  echo "kit token repository view: unavailable ($(head -c 200 <<<"$body" | tr '\n' ' '))"
                fi
              fi
              if [ "$n" -ge "$attempts" ]; then
                echo "::error::kit fetch failed after ${attempts} attempts"
                return "$code"
              fi
              sleep $(( backoff * n ))
              n=$(( n + 1 ))
            done
          }
          kit_fetch_retry go mod download

      - name: go vet
        run: go vet ./...

      # This is where the block's own kittest goldens and verb-semantics
      # suite run — the block's go.mod, not the kit's.
      - name: go test
        run: go test ./...

      # The kit repository is private, so blockverify is built from a
      # checkout minted with the same App token rather than a `go run` of a
      # released tag — this keeps the reusable workflow independent of
      # whether a given kit-ref has been tagged yet.
      - name: Checkout operator-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/operator-kit
          ref: ${{ inputs.kit-ref }}
          token: ${{ steps.kit_token.outputs.token }}
          path: operator-kit

      - name: Build blockverify
        working-directory: operator-kit
        run: go build -o ../blockverify ./blockverify

      - name: Build commentcheck
        working-directory: operator-kit
        run: go build -o ../commentcheck ./cmd/commentcheck

      # blockverify judges `.` and the image builds from `.`, so the kit
      # checked out inside the block's tree must be gone before either reads
      # it, or the block is judged by the kit's own source.
      - name: Remove the kit checkout from the block tree
        run: |
          rm -rf operator-kit

      # On a pull request blockverify compares spec.version with the base
      # commit's manifest.yaml. The checkout is shallow, so the base commit is
      # fetched first. The file goes to RUNNER_TEMP, outside the tree
      # blockverify judges, and a base with no manifest.yaml writes no file,
      # which blockverify reads as a block new on this branch.
      - name: Write the base commit's manifest
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:manifest.yaml" 2>/dev/null; then
            git show "$BASE_SHA:manifest.yaml" > "$RUNNER_TEMP/base-manifest.yaml"
          else
            echo "the base commit $BASE_SHA has no manifest.yaml, so the block is new on this branch"
          fi

      - name: Judge the comments this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./commentcheck -base "$BASE_SHA" .

      - name: blockverify (standalone contract check)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_flag=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_flag=(--base-manifest "$RUNNER_TEMP/base-manifest.yaml")
          fi
          ./blockverify --standalone --json "${base_flag[@]}" . > blockverify-report.json
          cat blockverify-report.json
          verdict=$(jq -r .verdict blockverify-report.json)
          if [ "$verdict" != "pass" ]; then
            echo "blockverify verdict was '$verdict', expected 'pass'" >&2
            exit 1
          fi

      # A failing run's report is exactly the one that must not be lost.
      - name: Upload blockverify report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockverify-report
          path: blockverify-report.json

  publish:
    needs: conformance
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BLOCK_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # The conformance job's identical "Mint kit token" entry explains the scope.
      - name: Mint kit token
        id: kit_token
        run: |
          set -euo pipefail
          APP_ID=$(aws ssm get-parameter --with-decryption --name /mitstack/MITSTACK_GITHUB_APP_ID --query Parameter.Value --output text)
          aws ssm get-parameter --with-decryption --name /mitstack/MITSTACK_GITHUB_APP_PRIVATE_KEY --query Parameter.Value --output text | sed 's/\\n/\n/g' > /tmp/app-key.pem
          chmod 600 /tmp/app-key.pem

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          JWT_HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          JWT_PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | b64url)
          JWT_SIG=$(printf '%s.%s' "$JWT_HEADER" "$JWT_PAYLOAD" | openssl dgst -sha256 -sign /tmp/app-key.pem -binary | b64url)
          JWT="$JWT_HEADER.$JWT_PAYLOAD.$JWT_SIG"
          rm -f /tmp/app-key.pem

          INSTALLATION_ID=$(curl -fsSL -H "Authorization: Bearer $JWT" https://api.github.com/app/installations \
            | jq -r '.[] | select(.account.login == "mitstack-eu") | .id')
          RESPONSE=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -d '{"repositories":["operator-kit"],"permissions":{"contents":"read"}}' \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
          TOKEN=$(jq -r .token <<<"$RESPONSE")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          # The minted token's own answer is logged, never the token itself.
          jq -r '"kit token minted: expires_at=\(.expires_at) repositories=\([.repositories[]?.name] | join(","))"' <<<"$RESPONSE"
          echo "KIT_TOKEN_MINTED_AT=$(date +%s)" >> "$GITHUB_ENV"

          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/mitstack-eu" >> "$GITHUB_ENV"

      - name: Write kit token to a secret file for the docker build
        env:
          KIT_TOKEN: ${{ steps.kit_token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KIT_TOKEN" > /tmp/kit-token
          chmod 600 /tmp/kit-token

      - name: Checkout operator-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/operator-kit
          ref: ${{ inputs.kit-ref }}
          token: ${{ steps.kit_token.outputs.token }}
          path: operator-kit

      - name: Build blockverify and blockprov
        working-directory: operator-kit
        run: |
          go build -o ../blockverify ./blockverify
          go build -o ../blockprov ./blockprov

      # blockverify judges `.` and the image builds from `.`, so the kit
      # checked out inside the block's tree must be gone before either reads
      # it, or the block is judged by the kit's own source.
      - name: Remove the kit checkout from the block tree
        run: |
          rm -rf operator-kit

      - name: Log in to ECR
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin "$REGISTRY"

      # A version tag already in the registry is never pushed over, and a
      # record already beside it is never written again. This probe is
      # read-only and answers into $GITHUB_OUTPUT: `published` for the
      # version tag and `record` for the provenance record tag
      # sha256-<hex>.prov that `blockprov push` writes for that digest. A
      # tag that is not published has no digest yet, so its record is
      # absent by definition and is not probed. A missing record is
      # completed only for an image this commit built, since the record
      # signs this commit. `aws ecr batch-get-image`
      # exits 0 with `None` when a tag is absent, so `None` and empty are
      # the only signals read as "absent". A non-zero exit from aws means
      # the probe could not answer, and that fails the job rather than
      # being read as absent.
      - name: Probe the version tag and its provenance record
        id: existing
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          probe() {
            aws ecr batch-get-image --repository-name "${{ inputs.ecr-repository }}" --image-ids "imageTag=$1" --query 'images[0].imageId.imageDigest' --output text
          }
          DIGEST=$(probe "v${VERSION}") || {
            echo "probe for v${VERSION} failed; refusing to guess whether it is published" >&2
            exit 1
          }
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already published: v${VERSION} ${DIGEST}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

          RECORD_TAG="sha256-${DIGEST#sha256:}.prov"
          RECORD=$(probe "$RECORD_TAG") || {
            echo "probe for ${RECORD_TAG} failed; refusing to guess whether the provenance record exists" >&2
            exit 1
          }
          if [ -n "$RECORD" ] && [ "$RECORD" != "None" ]; then
            echo "provenance record present at ${RECORD_TAG}"
            echo "record=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The record signs this run's commit, so it is completed only for
          # an image this commit built. The build tags the image with
          # the commit sha, so that tag must resolve to the same digest.
          BUILT=$(probe "${GITHUB_SHA}") || BUILT="unanswered"
          if [ "$BUILT" != "$DIGEST" ]; then
            echo "no provenance record at ${RECORD_TAG}, and v${VERSION} (${DIGEST}) was not built from commit ${GITHUB_SHA} (its sha tag answers ${BUILT}); rerun the run that published it to complete the record" >&2
            exit 1
          fi
          echo "no provenance record at ${RECORD_TAG}; completing it for ${DIGEST}"
          echo "record=false" >> "$GITHUB_OUTPUT"

      # The image build and this job's blockverify run both fetch the kit
      # with this token, and blockverify runs even when only the provenance
      # record is missing, so the job fetches the block's modules through a
      # bounded retry on every run, logging why any attempt failed.
      - name: Fetch Go modules
        env:
          KIT_TOKEN: ${{ steps.kit_token.outputs.token }}
        run: |
          set -uo pipefail
          # Runs "$@" up to KIT_FETCH_ATTEMPTS times, sleeping
          # KIT_FETCH_BACKOFF_SECONDS times the attempt number between tries.
          # Each failure logs the fetch output, the seconds since the mint and
          # what the same token's API view lists, never the token itself.
          kit_fetch_retry() {
            local attempts=${KIT_FETCH_ATTEMPTS:-5} backoff=${KIT_FETCH_BACKOFF_SECONDS:-10}
            local n=1 out code since body names
            # A bound that is not a positive integer would never end the loop.
            case "$attempts" in ''|*[!0-9]*|0) echo "KIT_FETCH_ATTEMPTS must be a positive integer, got '${attempts}'" >&2; return 2;; esac
            case "$backoff" in ''|*[!0-9]*) echo "KIT_FETCH_BACKOFF_SECONDS must be a whole number, got '${backoff}'" >&2; return 2;; esac
            while :; do
              since=""
              if out=$("$@" 2>&1); then code=0; else code=$?; fi
              [ -n "${KIT_TOKEN:-}" ] && out=${out//"$KIT_TOKEN"/***}
              [ -n "${KIT_TOKEN_MINTED_AT:-}" ] && since=", $(( $(date +%s) - KIT_TOKEN_MINTED_AT ))s after the kit token was minted"
              if [ "$code" -eq 0 ]; then
                [ -n "$out" ] && printf '%s\n' "$out"
                echo "kit fetch succeeded on attempt ${n}/${attempts}${since}"
                return 0
              fi
              echo "::warning::kit fetch attempt ${n}/${attempts} failed (exit ${code}${since})"
              printf '%s\n' "$out" | tail -n 20
              if [ -n "${KIT_TOKEN:-}" ]; then
                if body=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${KIT_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/installation/repositories?per_page=100" 2>&1) &&
                   names=$(jq -r '[.repositories[].name] | join(",")' <<<"$body" 2>/dev/null); then
                  echo "kit token repository view: ${names}"
                else
                  body=${body//"$KIT_TOKEN"/***}
                  echo "kit token repository view: unavailable ($(head -c 200 <<<"$body" | tr '\n' ' '))"
                fi
              fi
              if [ "$n" -ge "$attempts" ]; then
                echo "::error::kit fetch failed after ${attempts} attempts"
                return "$code"
              fi
              sleep $(( backoff * n ))
              n=$(( n + 1 ))
            done
          }
          kit_fetch_retry go mod download

      - name: Build and push image
        if: steps.existing.outputs.published == 'false'
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          DOCKER_BUILDKIT=1 docker build \
            --secret id=kit_token,src=/tmp/kit-token \
            -t "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}" \
            -t "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}" \
            .
          # The sha tag goes first: a version tag in the registry then always
          # has the sha tag the probe checks before completing a record.
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}"
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}" | cut -d@ -f2)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      # kit-ref names the kit that BUILT the tools above, not the one this
      # block compiles against, so the record's kitVersion comes from go.mod:
      # operator-kit, its operator-kit/vN path from v2 on, or the legacy
      # mitstack/examples/operator-kit.
      - name: Determine the kit version pinned in go.mod
        if: steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          # `|| true` keeps a no-match grep from tripping `set -e` under
          # `pipefail` before the check below ever runs — the failure is
          # still reported, just by that explicit check and its message
          # rather than a bare, undiagnosed pipeline abort.
          KIT_VERSION=$(grep -oE 'github\.com/mitstack-eu/(operator-kit(/v[0-9]+)?|mitstack/examples/operator-kit) v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | awk '{print $2}' || true)
          if [ -z "$KIT_VERSION" ]; then
            echo "no operator-kit version pin found in go.mod (checked github.com/mitstack-eu/operator-kit, github.com/mitstack-eu/operator-kit/vN and the legacy github.com/mitstack-eu/mitstack/examples/operator-kit)" >&2
            exit 1
          fi
          echo "KIT_VERSION=$KIT_VERSION" >> "$GITHUB_ENV"

      # A second gate over the same fact `needs: conformance` already
      # enforces: blockprov build refuses to sign anything but a fresh pass.
      - name: blockverify (standalone, for blockprov build's report)
        if: steps.existing.outputs.record == 'false'
        run: ./blockverify --standalone --json . > blockverify-report.json

      - name: blockprov build
        if: steps.existing.outputs.record == 'false'
        run: |
          ./blockprov build \
            --manifest manifest.yaml \
            --report blockverify-report.json \
            --block-id ${{ inputs.block-id }} \
            --block-version "$(awk '$1=="version:"{print $2; exit}' manifest.yaml)" \
            --image-ref "${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST}" \
            --image-digest "$IMAGE_DIGEST" \
            --kit-version "$KIT_VERSION" \
            --repository "${{ github.repository }}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --token-request-token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --out record.json

      # Masked and handed on as an env var, never as an argument. The comment
      # on "blockprov push", which reads it, says why.
      - name: Fetch ECR password
        id: ecr_password
        if: steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          PASSWORD=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # The credential is read from the environment, never argv, so it never
      # sits in /proc or a stray `set -x` trace.
      - name: blockprov push
        if: steps.existing.outputs.record == 'false'
        env:
          ECR_PASSWORD: ${{ steps.ecr_password.outputs.password }}
        run: |
          ./blockprov push \
            --record record.json \
            --registry "$REGISTRY" \
            --repo "${{ inputs.ecr-repository }}" \
            --image-digest "$IMAGE_DIGEST" \
            --username AWS \
            --password-env ECR_PASSWORD

      - name: Clean up the kit token file
        if: always()
        run: rm -f /tmp/kit-token
