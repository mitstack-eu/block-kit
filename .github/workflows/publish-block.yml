# Reusable block-publish workflow. A block's own ci.yml calls this with
# `uses:` on every event it wants verified, rather than inlining its own
# conformance, scan and publish jobs, so the provenance record every block
# writes beside its image comes from one implementation.
#
# Four jobs, and the ordering IS the acceptance criterion: `publish` needs
# `conformance`, `secrets` and `scripts`, so a red check never starts a
# publish, and `blockprov build` refuses a non-pass verdict a second time
# regardless.
#
# `conformance`, `secrets` and `scripts` run on every event. `publish` runs
# only on a push to the caller's default branch, so a pull-request run of a
# caller gets the three checks with the publish job skipped. A caller whose
# calling job is named `block` reports them as `block / conformance`,
# `block / secrets` and `block / scripts`, the contexts its main requires.
#
# `secrets` runs scripts/scan-secrets.sh, gitleaks over every commit the
# caller's HEAD reaches, and `scripts` runs scripts/lint-scripts.sh,
# shellcheck over every shell script the caller tracks. Both scripts come
# from the kit at kit-ref and pin their scanner by sha256.
#
# A version tag already in the registry is never pushed over. The probe asks
# two questions, whether the tag is published and whether its provenance
# record sits beside it. A rerun that finds the tag published but no
# provenance record builds and pushes the record for the existing digest and
# never pushes the image again. The record signs the run's commit, so only a
# rerun of the run that built the image completes it; a later commit that
# finds the record missing fails rather than attesting an image it did not
# build. A tag that already has its record ends green
# with no writes.
#
# Before any push, the publish job scans the image it built with a pinned
# Trivy, and a finding that has a fixed version stops the job.
name: publish-block

on:
  workflow_call:
    inputs:
      block-id:
        required: true
        type: string
      ecr-repository:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: eu-central-1
      kit-ref:
        required: false
        type: string
        default: main
      go-version:
        required: false
        type: string
        default: "1.26.8"
      runs-on:
        required: false
        type: string
        default: '["ubicloud-standard-2"]'

# A workflow-level default is a ceiling rather than a floor: each job below
# re-grants what it actually needs.
permissions:
  contents: read
  id-token: write

jobs:
  conformance:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: go vet
        run: go vet ./...

      # This is where the block's own kittest goldens and verb-semantics
      # suite run — the block's go.mod, not the kit's.
      - name: go test
        run: go test ./...

      # blockverify is built from a checkout of kit-ref rather than a `go run`
      # of a released tag, so the reusable workflow works whether or not a
      # given kit-ref has been tagged yet.
      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit

      - name: Build blockverify
        working-directory: block-kit
        run: go build -o ../blockverify ./verify/blockverify

      - name: Build commentcheck
        working-directory: block-kit
        run: go build -o ../commentcheck ./cmd/commentcheck

      # blockverify judges `.` and the image builds from `.`, so the kit
      # checked out inside the block's tree must be gone before either reads
      # it, or the block is judged by the kit's own source.
      - name: Remove the kit checkout from the block tree
        run: |
          rm -rf block-kit

      # On a pull request blockverify compares spec.version with the base
      # commit's manifest.yaml. The checkout is shallow, so the base commit is
      # fetched first. The file goes to RUNNER_TEMP, outside the tree
      # blockverify judges, and a base with no manifest.yaml writes no file,
      # which blockverify reads as a block new on this branch.
      - name: Write the base commit's manifest
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:manifest.yaml" 2>/dev/null; then
            git show "$BASE_SHA:manifest.yaml" > "$RUNNER_TEMP/base-manifest.yaml"
          else
            echo "the base commit $BASE_SHA has no manifest.yaml, so the block is new on this branch"
          fi

      - name: Judge the comments this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./commentcheck -base "$BASE_SHA" .

      - name: blockverify (standalone contract check)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_flag=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_flag=(--base-manifest "$RUNNER_TEMP/base-manifest.yaml")
          fi
          ./blockverify --standalone --json "${base_flag[@]}" . > blockverify-report.json
          cat blockverify-report.json
          verdict=$(jq -r .verdict blockverify-report.json)
          if [ "$verdict" != "pass" ]; then
            echo "blockverify verdict was '$verdict', expected 'pass'" >&2
            exit 1
          fi

      # A failing run's report is exactly the one that must not be lost.
      - name: Upload blockverify report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockverify-report
          path: blockverify-report.json

  secrets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: block
          fetch-depth: 0 # the scan reads every commit HEAD reaches
          persist-credentials: false

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Scan every commit for secrets with gitleaks
        run: bash block-kit/scripts/scan-secrets.sh block

  scripts:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: block
          persist-credentials: false

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit
          persist-credentials: false

      - name: Lint every tracked shell script with shellcheck
        run: bash block-kit/scripts/lint-scripts.sh block

  publish:
    needs: [conformance, secrets, scripts]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy reads these from its working directory with no flag, so a
      # committed one could silence a finding. None is allowed anywhere.
      - name: Refuse a committed Trivy ignore or config file
        run: |
          set -euo pipefail
          found=$(find . -path ./.git -prune -o \( -name .trivyignore -o -name .trivyignore.yaml -o -name trivy.yaml -o -name trivy-secret.yaml \) -print)
          if [ -n "$found" ]; then
            printf 'Trivy would read these with no flag, so the image is neither scanned nor pushed:\n%s\n' "$found" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BLOCK_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Checkout block-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mitstack-eu/block-kit
          ref: ${{ inputs.kit-ref }}
          path: block-kit

      - name: Build blockverify and blockprov
        working-directory: block-kit
        run: |
          go build -o ../blockverify ./verify/blockverify
          go build -o ../blockprov ./verify/blockprov

      # blockverify judges `.` and the image builds from `.`, so the kit
      # checked out inside the block's tree must be gone before either reads
      # it, or the block is judged by the kit's own source.
      - name: Remove the kit checkout from the block tree
        run: |
          rm -rf block-kit

      - name: Log in to ECR
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin "$REGISTRY"

      # A version tag already in the registry is never pushed over, and a
      # record already beside it is never written again. This probe is
      # read-only and answers into $GITHUB_OUTPUT: `published` for the
      # version tag and `record` for the provenance record tag
      # sha256-<hex>.prov that `blockprov push` writes for that digest. A
      # tag that is not published has no digest yet, so its record is
      # absent by definition and is not probed. A missing record is
      # completed only for an image this commit built, since the record
      # signs this commit. `aws ecr batch-get-image`
      # exits 0 with `None` when a tag is absent, so `None` and empty are
      # the only signals read as "absent". A non-zero exit from aws means
      # the probe could not answer, and that fails the job rather than
      # being read as absent.
      - name: Probe the version tag and its provenance record
        id: existing
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          probe() {
            aws ecr batch-get-image --repository-name "${{ inputs.ecr-repository }}" --image-ids "imageTag=$1" --query 'images[0].imageId.imageDigest' --output text
          }
          DIGEST=$(probe "v${VERSION}") || {
            echo "probe for v${VERSION} failed; refusing to guess whether it is published" >&2
            exit 1
          }
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already published: v${VERSION} ${DIGEST}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

          RECORD_TAG="sha256-${DIGEST#sha256:}.prov"
          RECORD=$(probe "$RECORD_TAG") || {
            echo "probe for ${RECORD_TAG} failed; refusing to guess whether the provenance record exists" >&2
            exit 1
          }
          if [ -n "$RECORD" ] && [ "$RECORD" != "None" ]; then
            echo "provenance record present at ${RECORD_TAG}"
            echo "record=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The record signs this run's commit, so it is completed only for
          # an image this commit built. The build tags the image with
          # the commit sha, so that tag must resolve to the same digest.
          BUILT=$(probe "${GITHUB_SHA}") || BUILT="unanswered"
          if [ "$BUILT" != "$DIGEST" ]; then
            echo "no provenance record at ${RECORD_TAG}, and v${VERSION} (${DIGEST}) was not built from commit ${GITHUB_SHA} (its sha tag answers ${BUILT}); rerun the run that published it to complete the record" >&2
            exit 1
          fi
          echo "no provenance record at ${RECORD_TAG}; completing it for ${DIGEST}"
          echo "record=false" >> "$GITHUB_OUTPUT"

      # One pinned version, checked by the binary's sha256.
      - name: Install Trivy
        if: steps.existing.outputs.published == 'false'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trivy
          echo "1f889576636db0623539cb339df7d06c40ebf39e7919489eafa1160e29808f19  $RUNNER_TEMP/trivy" | sha256sum -c -
          "$RUNNER_TEMP/trivy" --version

      # Any finding with a fixed version, at any severity, stops the job
      # before the first push.
      - name: Build and push image
        if: steps.existing.outputs.published == 'false'
        run: |
          set -euo pipefail
          VERSION=$(awk '$1=="version:"{print $2; exit}' manifest.yaml)
          DOCKER_BUILDKIT=1 docker build \
            -t "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}" \
            -t "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}" \
            .
          # An empty directory and no TRIVY_ variable leave no file or setting
          # that could silence a finding. The databases come from the first
          # mirror that answers.
          unset "${!TRIVY_@}"
          (cd "$(mktemp -d)" && "$RUNNER_TEMP/trivy" image --image-src docker --exit-code 1 --ignore-unfixed --no-progress \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            --java-db-repository mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1 \
            "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}")
          # The sha tag goes first: a version tag in the registry then always
          # has the sha tag the probe checks before completing a record.
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${{ inputs.ecr-repository }}:v${VERSION}"
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${{ inputs.ecr-repository }}:${GITHUB_SHA}" | cut -d@ -f2)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      # kit-ref names the kit that BUILT the tools above, not the one this
      # block compiles against, so the record's kitVersion comes from the
      # block-kit pin in go.mod.
      - name: Determine the kit version pinned in go.mod
        if: steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          # `|| true` keeps a no-match grep from tripping `set -e` under
          # `pipefail` before the check below ever runs — the failure is
          # still reported, just by that explicit check and its message
          # rather than a bare, undiagnosed pipeline abort.
          KIT_VERSION=$(grep -oE 'github\.com/mitstack-eu/block-kit v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | awk '{print $2}' || true)
          if [ -z "$KIT_VERSION" ]; then
            echo "no block-kit version pin found in go.mod (checked github.com/mitstack-eu/block-kit)" >&2
            exit 1
          fi
          echo "KIT_VERSION=$KIT_VERSION" >> "$GITHUB_ENV"

      # A second gate over the same fact `needs: conformance` already
      # enforces: blockprov build refuses to sign anything but a fresh pass.
      - name: blockverify (standalone, for blockprov build's report)
        if: steps.existing.outputs.record == 'false'
        run: ./blockverify --standalone --json . > blockverify-report.json

      - name: blockprov build
        if: steps.existing.outputs.record == 'false'
        run: |
          ./blockprov build \
            --manifest manifest.yaml \
            --report blockverify-report.json \
            --block-id ${{ inputs.block-id }} \
            --block-version "$(awk '$1=="version:"{print $2; exit}' manifest.yaml)" \
            --image-ref "${REGISTRY}/${{ inputs.ecr-repository }}@${IMAGE_DIGEST}" \
            --image-digest "$IMAGE_DIGEST" \
            --kit-version "$KIT_VERSION" \
            --repository "${{ github.repository }}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --token-request-token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --out record.json

      # Masked and handed on as an env var, never as an argument. The comment
      # on "blockprov push", which reads it, says why.
      - name: Fetch ECR password
        id: ecr_password
        if: steps.existing.outputs.record == 'false'
        run: |
          set -euo pipefail
          PASSWORD=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # The credential is read from the environment, never argv, so it never
      # sits in /proc or a stray `set -x` trace.
      - name: blockprov push
        if: steps.existing.outputs.record == 'false'
        env:
          ECR_PASSWORD: ${{ steps.ecr_password.outputs.password }}
        run: |
          ./blockprov push \
            --record record.json \
            --registry "$REGISTRY" \
            --repo "${{ inputs.ecr-repository }}" \
            --image-digest "$IMAGE_DIGEST" \
            --username AWS \
            --password-env ECR_PASSWORD
