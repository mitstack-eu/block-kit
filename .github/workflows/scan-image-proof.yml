name: scan-image-proof

# The image scan's GO-2026-5932 exception exists for the AWS and Scaleway
# provider releases OpenTofu blocks install, and its dated exception for the
# Scaleway 2.92.1 binary alone. So a pull request that changes the scan runs it
# on an image holding each release where the operator image keeps its
# providers, fetched by the checksum the registry publishes. Each row lists the
# findings the scan must accept in that binary and those it must refuse there,
# and its exit.
on:
  pull_request:
    paths:
      - scripts/scan-image.sh
      - scripts/go-2026-5932-exception.sh
      - scripts/pinned-tool.sh
      - cmd/gofuncnames/**
      - .github/workflows/scan-image-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-provider:
    name: scan ${{ matrix.provider }} ${{ matrix.version }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: hashicorp/aws
            version: 6.73.0
            zip-sha256: a61f8e114e5233e63b8d2b034b1ad59a220e532fa34aaaa63eec6bad73a0ca21
            exit: 0
            accepted: GO-2026-5932
            refused: ''
          - provider: scaleway/scaleway
            version: 2.89.0
            zip-sha256: c60b9bbd7c5875bf705f8ffc966574266f7293daf1dc632b1f4443aea23c2fe2
            exit: 1
            accepted: GO-2026-5932
            refused: CVE-2026-78661 CVE-2026-97045 CVE-2026-97054
          - provider: scaleway/scaleway
            version: 2.92.1
            zip-sha256: 2604434bb120cf28ce401c233dded7ef775c536a5b560d76c1a2cb615b5df844
            exit: 0
            accepted: GO-2026-5932 CVE-2026-78661 CVE-2026-97045 CVE-2026-97054
            refused: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
      - name: Build an image holding the provider where the operator image keeps it
        env:
          PROVIDER: ${{ matrix.provider }}
          VERSION: ${{ matrix.version }}
          ZIP_SHA256: ${{ matrix.zip-sha256 }}
        run: |
          set -euo pipefail
          meta=$(curl -fsSL "https://registry.opentofu.org/v1/providers/$PROVIDER/$VERSION/download/linux/amd64")
          shasum=$(jq -r .shasum <<<"$meta")
          if [ "$shasum" != "$ZIP_SHA256" ]; then
            echo "the registry publishes sha256 $shasum for $PROVIDER $VERSION, not the pinned $ZIP_SHA256" >&2
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/provider.zip" "$(jq -r .download_url <<<"$meta")"
          echo "$ZIP_SHA256  $RUNNER_TEMP/provider.zip" | sha256sum -c -
          dir="$RUNNER_TEMP/image/var/cache/tofu-plugins/registry.opentofu.org/$PROVIDER/$VERSION/linux_amd64"
          mkdir -p "$dir"
          unzip -q "$RUNNER_TEMP/provider.zip" -d "$dir"
          printf 'FROM scratch\nCOPY var /var\n' > "$RUNNER_TEMP/image/Dockerfile"
          docker build -q -t scan-image-proof "$RUNNER_TEMP/image"
      - name: Scan the image, expecting exit ${{ matrix.exit }} and each listed finding accepted or refused
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
          VERSION: ${{ matrix.version }}
          WANT_EXIT: ${{ matrix.exit }}
          ACCEPTED: ${{ matrix.accepted }}
          REFUSED: ${{ matrix.refused }}
        run: |
          # The runner's bash -e would end the step at the scan's expected exit 1.
          set +e
          bash scripts/scan-image.sh scan-image-proof 2>&1 | tee "$RUNNER_TEMP/scan.txt"
          status=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat "$RUNNER_TEMP/scan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          scan="$RUNNER_TEMP/scan.txt"
          binary="var/cache/tofu-plugins/registry.opentofu.org/$PROVIDER/$VERSION/"
          wrong=""
          if [ "$status" != "$WANT_EXIT" ]; then wrong="$wrong exited $status, want $WANT_EXIT;"; fi
          for id in $ACCEPTED; do
            if ! grep -qF "accepted $id in $binary" "$scan"; then wrong="$wrong no line starting 'accepted $id in $binary';"; fi
            if grep -q "^refused $id in " "$scan"; then wrong="$wrong $id refused;"; fi
          done
          for id in $REFUSED; do
            if ! grep -qF "refused $id in $binary" "$scan"; then wrong="$wrong no line starting 'refused $id in $binary';"; fi
            if grep -q "^accepted $id in " "$scan"; then wrong="$wrong $id accepted;"; fi
          done
          if [ -n "$wrong" ]; then
            echo "scan-image.sh on $PROVIDER $VERSION:$wrong" >&2
            exit 1
          fi
