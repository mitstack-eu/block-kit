name: ci

# Every pull request, and every push to main so the release job below has
# something to run after. A dispatch on main cuts a release a lost push run
# left owed, with no new commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release dry run reads the tags and the pull request's history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - run: go vet ./...
      - run: go test ./...
      # Every event builds the tools image and checks each file it holds
      # against its pin, so a change that breaks it fails here, before a
      # release would publish it.
      - name: Build the tools image and check every file it holds
        run: |
          docker build --platform linux/amd64 -t block-kit-tools:ci helpers/tools
          TOOLS_IMAGE=block-kit-tools:ci go test -tags toolsimage -count=1 -run '^TestToolsImage_HoldsEveryFileAtItsPinInALayerOfItsOwn$' ./helpers/tools
      # The example block is a module of its own, which ./... leaves out, and
      # blockverify holds it to the same checks as any other block.
      - name: Test the example block and run blockverify on it
        run: |
          go -C examples/hetzner-firewall vet ./...
          go -C examples/hetzner-firewall test ./...
          go run ./verify/blockverify --standalone examples/hetzner-firewall
      # The rescue SSH session is a module of its own, so that the kit's
      # module stays stdlib-only, and ./... leaves it out as well.
      - name: Test the rescuessh module
        run: |
          go -C capabilities/hetzner/robot/rescuessh vet ./...
          go -C capabilities/hetzner/robot/rescuessh test ./...
      # The rescuessh module alone requires a third-party module, so only its
      # dependencies need a scan.
      - name: Scan the rescuessh module's dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -C capabilities/hetzner/robot/rescuessh -scan package ./...
      # The health handler is a module of its own, so an operator on any kit
      # release mounts it, and ./... leaves it out.
      - name: Test the healthz module
        run: |
          go -C helpers/healthz vet ./...
          go -C helpers/healthz test ./...
      - run: bash scripts/release-block-kit_test.sh
      # The release job runs only after a merge, so a line it would refuse has
      # to fail here, in a check main requires, before it reaches main.
      - name: Dry-run the kit release over the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/release-block-kit.sh --dry-run \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - name: Dry-run the rescuessh release over the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/release-block-kit.sh --module capabilities/hetzner/robot/rescuessh --dry-run \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - name: Dry-run the healthz release over the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/release-block-kit.sh --module helpers/healthz --dry-run \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  # A pull request's own delivery intent has to reach the board somehow: a
  # merge commit or a rebase carries it in the commits, a squash carries it
  # only in the title, so this gates on both. pull_request only — a push to
  # main has already merged, and record-delivery below is what reads it
  # then.
  pr-key-gate:
    name: pr key gate
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base..head range needs history a shallow checkout has not
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Gate the pull request on a board key
        # PR_TITLE carries the title through the environment rather than
        # interpolated straight into the shell below: a pull request's title
        # is attacker-controlled text, and inline interpolation into run:
        # would be a script-injection hole.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          go run github.com/mitstack-eu/plain-delivery/cmd/pr-keys@v0.1.0 \
            --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  comment-check:
    name: comment check
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit has to be in the clone
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Judge the comments this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/commentcheck -base "$BASE_SHA" .

  # This repository IS the kit, so a change reaching main without a tag is
  # unreachable to every block importing it. A thin caller by design: the
  # script owns the decision and the version arithmetic, and no copy of
  # either lives here.
  # A release also pushes the tools image to the public package
  # ghcr.io/mitstack-eu/block-kit-tools under the planned tag, signs its digest
  # keyless, pulls it with no login, and copies every tool out of it. A digest
  # cannot sit in the commit its image is built from, so the script tags a
  # commit on top of main's that writes the reference into tools.Image, and
  # main's tools.Image names no image.
  release:
    name: kit release
    needs: test
    # The ref check keeps a dispatch on another branch from tagging an unmerged commit.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    # The job's own grant. A workflow-level default is a ceiling rather than a
    # floor, so a job that never re-grants runs with metadata read alone and
    # cannot push the tag it computed.
    permissions:
      contents: write
      packages: write # the tools image
      id-token: write # cosign's keyless signature
    concurrency:
      group: kit-release
      cancel-in-progress: false
    env:
      TOOLS_PACKAGE: ghcr.io/mitstack-eu/block-kit-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version scan reads tags, and a shallow checkout has none
      # The shell is named because the default run shell leaves pipefail
      # off, and a pipeline's status is its last command's. The tee would
      # then return 0 over every failing exit the script has.
      # No --base: the script resolves the base from the newest kit tag, so
      # a run that was skipped or red does not lose its release. The next
      # push or a dispatch on main picks it up, with no change of its own.
      - name: Plan the kit tag
        id: plan
        shell: bash
        run: bash scripts/release-block-kit.sh --dry-run | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.plan.outputs.planned != ''
        with:
          go-version: '1.26.10'

      - name: Copy cosign v2.5.3 out of its publisher's image
        if: steps.plan.outputs.planned != ''
        run: |
          bash scripts/copy-tool.sh ghcr.io/sigstore/cosign/cosign:v2.5.3@sha256:f1946d0f30fc8e3777b02f2201e02efdba9fe38f4918162f937052fac98e083f /ko-app/cosign 056df4b41218fff47e879470554e01b0ba8e7608c1bec1e704c9dcded965f00f "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Push the tools image and sign its digest
        id: image
        if: steps.plan.outputs.planned != ''
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.planned }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$TOOLS_PACKAGE:$TAG" --metadata-file "$RUNNER_TEMP/build.json" helpers/tools
          ref="$TOOLS_PACKAGE:$TAG@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")"
          cosign sign --yes "$ref"
          docker logout ghcr.io
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pushed and signed $ref"

      # A k3s node and a Docker host copy their tools with no credential, so
      # a release needs a public package. GitHub makes a new package private,
      # so the first release fails here until an owner makes it public.
      - name: Verify the signature and pull the image with no login
        if: steps.plan.outputs.planned != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gh api "orgs/mitstack-eu/packages/container/${TOOLS_PACKAGE##*/}" --jq '{name, visibility, created_at}'
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/mitstack-eu/block-kit/.github/workflows/ci.yml@refs/heads/main \
            "$REF" > /dev/null
          docker image rm "${REF%@*}" || true # a copy the push left behind must not answer the pull
          docker pull "$REF"

      - name: Copy every tool out of the published image, through Docker and over the registry's HTTP API
        if: steps.plan.outputs.planned != ''
        env:
          TOOLS_IMAGE: ${{ steps.image.outputs.ref }}
        run: go test -tags toolsimage -count=1 -run '^TestToolsImage_' ./helpers/tools

      - name: Cut the kit tag on a commit that pins the tools image
        if: steps.plan.outputs.planned != ''
        shell: bash
        env:
          TOOLS_IMAGE: ${{ steps.image.outputs.ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/release-block-kit.sh --tools-image "$TOOLS_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cut the rescuessh tag when the module changed
        shell: bash
        run: bash scripts/release-block-kit.sh --module capabilities/hetzner/robot/rescuessh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cut the healthz tag when the module changed
        shell: bash
        run: bash scripts/release-block-kit.sh --module helpers/healthz | tee -a "$GITHUB_STEP_SUMMARY"

  # This repository has no other mechanism that reaches the board, so a
  # ticket delivered here never reached Done. needs: [test, release] only
  # requires both to have SUCCEEDED — never released's outputs.released —
  # because a docs-only push that cut no tag still delivers its keys.
  record-delivery:
    name: record delivery
    needs: [test, release]
    # The ref check keeps a dispatch on another branch from recording its commits.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    # The job's own grant. A workflow-level default is a ceiling rather than a
    # floor, so a job that never re-grants runs with metadata read alone and
    # cannot push the anchor tag it advances.
    permissions:
      contents: write
    # Two pushes to main close together would otherwise both read the
    # board-synced anchor tag before either advances it, derive overlapping
    # ranges, and race the tag push, leaving the anchor behind the
    # repository's real position. cancel-in-progress stays false: a run
    # cancelled between the board write and the tag advance would leave the
    # anchor further behind than a serialized run ever would.
    concurrency:
      group: record-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # range resolution reads the board-synced tag and history a shallow checkout has neither
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Record this push's delivered board keys
        # No shell override: this runs a single go run with no pipe, so
        # naming bash would only add pipefail, which has nothing to act on
        # here. The default shell's -e already fails it, so a rejected
        # board write or a git push failure already turns this run red.
        env:
          TRACKER_BASE_URL: ${{ vars.TRACKER_BASE_URL }}
          TRACKER_API_TOKEN: ${{ secrets.TRACKER_API_TOKEN }}
        run: |
          go run github.com/mitstack-eu/plain-delivery/cmd/board-delivery@v0.1.0 \
            --repo . \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}"
